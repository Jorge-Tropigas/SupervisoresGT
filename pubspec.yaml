name: app_supervisores_gt
description: "A new Flutter project."

publish_to: "none"

version: 2.0.1+6
environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # Librería interna (manejo dio, errores HTTP, utilidades compartidas)
  tomza_kit:
    git:
      url: https://github.com/Jorge-Tropigas/tomza_kit/
      ref: main

  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  provider: ^6.1.5+1
  animated_notch_bottom_bar: ^1.0.4
  lottie: ^3.6.1
  syncfusion_flutter_charts: ^35.1.37
  intl: ^0.20.3
  android_intent_plus: ^6.1.0
  image_picker: ^1.1.2
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  device_info_plus: ^13.3.0
  get_it: ^9.3.0
  uuid: ^4.6.0
  flutter_dotenv: ^6.0.1
  package_info_plus: ^10.2.2
  flutter_localizations:
    sdk: flutter
  geolocator: ^14.1.2
  syncfusion_flutter_signaturepad: ^35.1.41
  material: ^1.0.1

  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
dependency_overrides:
  dbus: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  tidy_imports: ^1.2.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - env.dev
    - env.prod
    - assets/
    - assets/animations/
    - assets/images/

tidy_imports:
  tiers:
    - name: "Flutter & Third-party packages"
      pattern: "^package:(?!tomza_kit|app_supervisores_gt)"
    - name: "Custom packages"
      pattern: "^package:tomza_kit"
    - name: "App packages"
      pattern: "^package:app_supervisores_gt  "
