<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; }
  svg { max-width: 600px; width: 100%; height: auto; }

  /* Bar animations - each bar grows/shrinks with different timing */
  @keyframes bar1 { 0%,100%{height:40px;y:130} 50%{height:65px;y:105} }
  @keyframes bar2 { 0%,100%{height:55px;y:115} 50%{height:35px;y:135} }
  @keyframes bar3 { 0%,100%{height:70px;y:100} 50%{height:90px;y:80} }
  @keyframes bar4 { 0%,100%{height:50px;y:120} 50%{height:30px;y:140} }
  @keyframes bar5 { 0%,100%{height:80px;y:90} 50%{height:60px;y:110} }
  @keyframes bar6 { 0%,100%{height:60px;y:110} 50%{height:85px;y:85} }
  @keyframes bar7 { 0%,100%{height:45px;y:125} 50%{height:70px;y:100} }

  .bar1 { animation: bar1 3s ease-in-out infinite; }
  .bar2 { animation: bar2 3s ease-in-out infinite 0.15s; }
  .bar3 { animation: bar3 3s ease-in-out infinite 0.3s; }
  .bar4 { animation: bar4 3s ease-in-out infinite 0.45s; }
  .bar5 { animation: bar5 3s ease-in-out infinite 0.6s; }
  .bar6 { animation: bar6 3s ease-in-out infinite 0.75s; }
  .bar7 { animation: bar7 3s ease-in-out infinite 0.9s; }

  /* Head bobbing */
  @keyframes bobHead { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .head-bob { animation: bobHead 3s ease-in-out infinite; transform-origin: center; }
  .head-bob2 { animation: bobHead 3s ease-in-out infinite 0.3s; transform-origin: center; }

  /* Small legend squares pulse */
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .legend-pulse { animation: pulse 3s ease-in-out infinite; }
</style>
</head>
<body>
<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Floor / desk area -->
  <ellipse cx="250" cy="360" rx="200" ry="15" fill="#f0f0f0" opacity="0.5"/>

  <!-- Plant pot -->
  <g transform="translate(80, 260)">
    <!-- Pot -->
    <path d="M-8,40 L-12,65 L12,65 L8,40 Z" fill="#e8e0d8"/>
    <rect x="-10" y="36" width="20" height="6" rx="2" fill="#d4ccc4"/>
    <!-- Leaves -->
    <path d="M0,38 C-15,20 -25,5 -18,-10" stroke="#e07060" stroke-width="2" fill="none"/>
    <path d="M-18,-10 C-22,-5 -20,0 -15,2" fill="#e07060"/>
    <path d="M0,38 C5,20 15,10 20,0" stroke="#e07060" stroke-width="2" fill="none"/>
    <path d="M20,0 C22,5 18,8 14,6" fill="#e07060"/>
    <path d="M0,38 C-5,25 -10,15 -5,5" stroke="#c05545" stroke-width="2" fill="none"/>
    <path d="M-5,5 C-8,8 -4,12 0,10" fill="#c05545"/>
    <path d="M0,38 C10,25 18,15 15,0" stroke="#e07060" stroke-width="2" fill="none"/>
    <path d="M15,0 C18,3 15,8 11,7" fill="#e07060"/>
    <path d="M0,38 C-10,28 -22,20 -25,8" stroke="#c05545" stroke-width="2" fill="none"/>
    <path d="M-25,8 C-28,12 -22,15 -19,12" fill="#c05545"/>
  </g>

  <!-- Whiteboard / Chart board -->
  <g transform="translate(175, 55)">
    <!-- Board frame -->
    <rect x="0" y="0" width="170" height="130" rx="4" fill="#4a4a5a" />
    <rect x="6" y="6" width="158" height="118" rx="2" fill="#5a5a6a" />

    <!-- Legend squares -->
    <rect class="legend-pulse" x="105" y="14" width="10" height="10" rx="1" fill="#e07060"/>
    <rect class="legend-pulse" x="120" y="14" width="10" height="10" rx="1" fill="#f0a090" style="animation-delay:0.3s"/>

    <!-- Chart bars -->
    <rect class="bar1" x="20"  y="130" width="14" height="40" rx="1" fill="#e8e0d8" transform="translate(0,-60)"/>
    <rect class="bar2" x="38"  y="115" width="14" height="55" rx="1" fill="#e07060" transform="translate(0,-60)"/>
    <rect class="bar3" x="56"  y="100" width="14" height="70" rx="1" fill="#e8e0d8" transform="translate(0,-60)"/>
    <rect class="bar4" x="74"  y="120" width="14" height="50" rx="1" fill="#e07060" transform="translate(0,-60)"/>
    <rect class="bar5" x="92"  y="90"  width="14" height="80" rx="1" fill="#e8e0d8" transform="translate(0,-60)"/>
    <rect class="bar6" x="110" y="110" width="14" height="60" rx="1" fill="#e07060" transform="translate(0,-60)"/>
    <rect class="bar7" x="128" y="125" width="14" height="45" rx="1" fill="#e07060" transform="translate(0,-60)"/>
  </g>

  <!-- Desk / table -->
  <g transform="translate(130, 295)">
    <rect x="0" y="0" width="100" height="4" rx="1" fill="#d4ccc4"/>
    <rect x="10" y="4" width="3" height="30" fill="#c4bbb2"/>
    <rect x="87" y="4" width="3" height="30" fill="#c4bbb2"/>
  </g>

  <!-- Person 1 (woman, left) -->
  <g transform="translate(220, 175)">
    <!-- Body -->
    <path d="M-5,45 L-15,140 L-5,140 L0,80 L5,140 L15,140 L5,45 Z" fill="#3a3a4a"/>
    <!-- Shirt -->
    <path d="M-18,20 C-20,35 -15,50 -5,45 L5,45 C15,50 20,35 18,20 Z" fill="#e8e0d8"/>
    <!-- Arms -->
    <path d="M-18,22 C-25,35 -22,50 -10,55" stroke="#e8e0d8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M18,22 C22,35 15,50 5,48" stroke="#e8e0d8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Neck -->
    <rect x="-3" y="10" width="6" height="12" rx="2" fill="#f0c0a8"/>
    <!-- Head -->
    <g class="head-bob">
      <ellipse cx="0" cy="0" rx="14" ry="16" fill="#f0c0a8"/>
      <!-- Hair -->
      <path d="M-14,0 C-14,-18 -8,-22 0,-22 C8,-22 14,-18 14,0 C14,-8 8,-16 0,-16 C-8,-16 -14,-8 -14,0 Z" fill="#2a2a3a"/>
      <path d="M-14,-2 C-16,5 -18,15 -14,18" stroke="#2a2a3a" stroke-width="4" fill="none"/>
    </g>
  </g>

  <!-- Person 2 (man, right) -->
  <g transform="translate(275, 170)">
    <!-- Legs -->
    <path d="M-5,55 L-12,145 L-2,145 L0,85 L2,145 L12,145 L5,55 Z" fill="#3a3a4a"/>
    <!-- Shirt -->
    <path d="M-16,22 C-18,38 -12,55 -5,55 L5,55 C12,55 18,38 16,22 Z" fill="#e07060"/>
    <!-- Arms -->
    <path d="M-16,24 C-22,38 -18,50 -8,52" stroke="#e07060" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M16,24 C20,35 12,48 2,50" stroke="#e07060" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Hands / tablet -->
    <rect x="-12" y="48" width="16" height="22" rx="2" fill="#3a3a4a" transform="rotate(-5,-4,59)"/>
    <rect x="-10" y="50" width="12" height="18" rx="1" fill="#6a8ab0" transform="rotate(-5,-4,59)"/>
    <!-- Neck -->
    <rect x="-3" y="12" width="6" height="12" rx="2" fill="#f0c0a8"/>
    <!-- Head -->
    <g class="head-bob2">
      <ellipse cx="0" cy="2" rx="13" ry="15" fill="#f0c0a8"/>
      <!-- Hair -->
      <path d="M-13,0 C-13,-16 -7,-20 0,-20 C7,-20 13,-16 13,0 C13,-6 7,-14 0,-14 C-7,-14 -13,-6 -13,0 Z" fill="#2a2a3a"/>
    </g>
  </g>

</svg>
</body>
</html>
